[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "printcal"
version = "1.0.0"
description = "3D printer calibration math: e-steps, flow rate, volumetric speed and magic layer heights."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["3d-printing", "calibration", "e-steps", "flow-rate", "klipper", "marlin", "ender-3"]

[project.urls]
Homepage = "https://sizebench.com/3d-printing"

[project.scripts]
printcal = "printcal.__main__:main"

[tool.setuptools]
packages = ["printcal"]
